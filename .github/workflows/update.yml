name: Update AltGallery LBox source
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - convert.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-altgallery-lbox
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and convert upstream source
        run: python convert.py
      - name: Commit changed feed
        run: |
          if git diff --quiet -- altgallery-lbox.json; then
            echo "Source is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altgallery-lbox.json
          git commit -m "Update AltGallery LBox source"
          git push
